<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily stuff</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7B1E2C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily stuff">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F2F2; --surface:#FFFFFF; --surface-2:#F3ECEC; --line:#E9DEDF;
  --text:#251B1C; --muted:#73676A; --primary:#7B1E2C; --primary-strong:#5C1420; --on-primary:#FFFFFF;
  --primary-soft:#F4E2E4; --accent:#C47A12; --accent-soft:#FBEFD8; --star:#D9A11E; --warn:#B3261E;
  --shadow:0 1px 2px rgba(16,40,36,.06),0 4px 14px rgba(16,40,36,.06);
  --hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  --ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  /* names the older code still uses */
  --ink:var(--primary); --ink-soft:var(--primary); --ink-wash:var(--primary-soft); --pencil:var(--muted);
  --paper:var(--surface); --rule:var(--line); --carry:var(--accent); --done:var(--primary); --card:var(--surface);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141011; --surface:#1E1718; --surface-2:#281F21; --line:#382C2E;
    --text:#EFE7E8; --muted:#A8999C; --primary:#E59AA6; --primary-strong:#F2BAC2; --on-primary:#1A0F11;
    --primary-soft:#3D1F25; --accent:#F0B357; --accent-soft:#3A2A14; --star:#F2C14E; --warn:#F08C80; --hero:#5E1A25;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141011; --surface:#1E1718; --surface-2:#281F21; --line:#382C2E;
  --text:#EFE7E8; --muted:#A8999C; --primary:#E59AA6; --primary-strong:#F2BAC2; --on-primary:#1A0F11;
  --primary-soft:#3D1F25; --accent:#F0B357; --accent-soft:#3A2A14; --star:#F2C14E; --warn:#F08C80; --hero:#5E1A25;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--ui);-webkit-font-smoothing:antialiased;min-height:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}

/* portrait column, even on a laptop */
.page{max-width:460px;margin:0 auto;padding:14px 14px calc(96px + env(safe-area-inset-bottom,0px));min-height:100vh}

/* ---- hero header (Today) ---- */
header{background:var(--hero, #7B1E2C);color:#FFFFFF;border-radius:20px;padding:14px 16px 16px;box-shadow:var(--shadow)}
header[hidden],.today-link[hidden]{display:none}
.datebar{display:flex;align-items:center;gap:4px}
.datebar h1{font:700 38px/1 var(--hand);margin:0;flex:1;text-align:center}
.iconbtn{width:40px;height:40px;border:0;background:none;border-radius:50%;color:inherit;font-size:22px;display:grid;place-items:center}
header .iconbtn:hover{background:rgba(255,255,255,.15)}
.today-link{display:block;margin:2px auto 0;border:0;background:none;color:inherit;opacity:.85;font-size:13px;text-decoration:underline}
.routine{display:flex;background:rgba(0,0,0,.14);border-radius:12px;padding:3px;margin:12px 0 0}
.routine button{flex:1;border:0;background:none;padding:7px 0;font-size:14px;font-weight:600;color:inherit;border-radius:9px;opacity:.85}
.routine button[aria-pressed="true"]{background:#FFFFFF;color:var(--hero, #7B1E2C);opacity:1}
.meter{margin-top:14px}
.meter-line{font-size:15px}
.meter-line b{font-size:22px;font-weight:700}
header .bar{background:rgba(255,255,255,.25)}
header .bar>i{background:#FFFFFF}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;opacity:.9;margin-top:8px}

/* ---- bottom tab bar ---- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs .inner{display:flex;width:100%;max-width:460px}
nav.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11.5px;font-weight:600;color:var(--muted);border-radius:12px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"]{color:var(--primary)}
nav.tabs button[aria-selected="true"] svg{background:var(--primary-soft);border-radius:10px;padding:2px 10px;width:44px;box-sizing:content-box}

/* ---- headings: only the big ones use the handwriting font ---- */
section h2{font:700 30px/1.1 var(--hand);color:var(--text);margin:22px 4px 6px}
.sub{color:var(--muted);font-size:13.5px;margin:0 4px 10px}
.empty{color:var(--muted);padding:18px 4px;text-align:center}

/* ---- cards & rows ---- */
ul.lines{list-style:none;margin:0;padding:0}
#view>ul.lines, .card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-top:14px}
.row{display:flex;align-items:center;gap:12px;min-height:58px;padding:10px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.check{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:none;display:grid;place-items:center;color:var(--on-primary);padding:0;transition:background .15s,border-color .15s}
.check:hover{border-color:var(--primary)}
.row.done .check{background:var(--primary);border-color:var(--primary)}
.check svg{width:15px;height:15px;opacity:0;transform:scale(.6);transition:.2s}
.row.done .check svg{opacity:1;transform:none}
.info{flex:1;min-width:0}
.name{flex:1;min-width:0;font-size:15.5px;font-weight:500;color:var(--text)}
.row.done .name{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted)}
.prog{display:flex;align-items:center;gap:8px;margin-top:5px}
.mini{flex:1;height:5px;background:var(--surface-2);border-radius:4px;overflow:hidden;max-width:120px}
.mini>i{display:block;height:100%;background:var(--primary);border-radius:4px}
.ptext{font-size:12.5px;color:var(--muted);white-space:nowrap}
.ptext input{width:38px;text-align:right;border:0;border-bottom:1px dashed var(--line);background:none;font-weight:600;color:var(--text);padding:0 1px;font-size:13px}
.ptext input:focus{outline:none;border-bottom-color:var(--primary)}
.ctrls{display:flex;gap:6px;flex:none}
.step{border:0;background:var(--primary-soft);color:var(--primary-strong);border-radius:10px;height:34px;min-width:44px;padding:0 10px;font-size:13px;font-weight:700}
.step:hover{filter:brightness(.97)}
.timer{width:34px;height:34px;border:0;background:var(--surface-2);color:var(--primary-strong);border-radius:10px;padding:0;display:grid;place-items:center;font-size:12px}
.timer.on{background:var(--accent);color:#fff;width:auto;padding:0 10px;font-size:13px;font-variant-numeric:tabular-nums;font-weight:700}

/* ---- buttons ---- */
.btn{border:0;background:var(--primary);color:var(--on-primary);border-radius:12px;padding:10px 16px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:var(--surface);color:var(--primary-strong);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--primary)}
.del{border:0;background:none;color:var(--muted);font-size:18px;width:32px;height:32px;border-radius:10px;flex:none}
.del:hover{color:var(--warn);background:var(--surface-2)}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin:14px 0 0;gap:8px;flex-wrap:wrap}
.sync{font-size:12px;color:var(--muted);margin:0 auto}

/* ---- edit habits ---- */
.edit{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:10px 12px;margin-top:10px;display:grid;grid-template-columns:1fr auto;gap:6px 8px;align-items:center}
.edit input[type=text]{border:0;border-bottom:1.5px solid var(--line);background:none;font-size:15.5px;font-weight:600;width:100%;padding:4px 0}
.edit input[type=text]:focus{outline:none;border-bottom-color:var(--primary)}
.edit .opts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;font-size:13px;color:var(--muted)}
.edit .opts input[type=number]{width:52px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);text-align:right;color:var(--text);font-weight:600;padding:3px 6px}
.edit select{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:3px 6px;color:var(--text)}

/* ---- progress bars & weekly rows ---- */
.bar{height:8px;background:var(--surface-2);border-radius:6px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--primary);border-radius:6px;transition:width .4s ease}
.wk{background:var(--surface);padding:12px 14px;border-bottom:1px solid var(--line)}
.wk-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.wk-name{font-size:15px;font-weight:600}
.wk-num{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.wk-num b{color:var(--text)}
.wk.met .wk-num b{color:var(--primary)}
.wk.met .bar>i{background:var(--primary-strong)}
.dots{display:flex;gap:5px;margin-top:8px}
.dots i{width:14px;height:14px;border-radius:5px;background:var(--surface-2)}
.dots i.on{background:var(--primary)}
.book-inputs{display:flex;gap:12px;align-items:center;margin-top:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.book-inputs input{width:58px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);text-align:right;font-weight:600;color:var(--text);padding:3px 6px}

/* ---- this week ---- */
.heading{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);margin-top:12px;overflow:hidden;padding-bottom:6px}
.heading h3{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--primary);margin:0;padding:12px 14px 4px}
.heading.empty h3{color:var(--muted)}
.heading .row{min-height:48px;padding:8px 10px 8px 14px}
.heading .wk{border-bottom:1px solid var(--line)}
.add-inline{display:flex;gap:6px;margin:4px 14px 4px}
.add-inline input{flex:1;border:0;border-radius:10px;background:var(--surface-2);padding:9px 12px;font-size:14px;color:var(--text)}
.add-inline input::placeholder{color:var(--muted)}
.add-inline input:focus{outline:2px solid var(--primary);outline-offset:0}
.row.moved .name{color:var(--accent)}
.row.moved .check{border-color:var(--accent);border-style:dashed}
.row.carried{box-shadow:inset 4px 0 0 var(--accent)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:3px 7px;margin-left:6px;vertical-align:middle;white-space:nowrap;text-decoration:none}
.stars{display:inline-flex;flex:none}
.stars button{border:0;background:none;padding:2px 1px;font-size:17px;line-height:1;color:var(--line)}
.stars button.on{color:var(--star)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:0 4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ---- dashboard ---- */
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;margin:4px 0 0}
.seg button{flex:1;border:0;background:none;padding:8px 0;font-size:14px;font-weight:600;color:var(--muted);border-radius:9px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--primary-strong);box-shadow:var(--shadow)}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 4px}
.summary div{background:var(--surface);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.summary b{display:block;font-size:24px;font-weight:700;color:var(--primary)}
.summary span{font-size:12.5px;color:var(--muted)}
.dash-search{margin:12px 0 0;width:100%;border:0;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);padding:12px 14px;font-size:15px;color:var(--text)}
.dash-search:focus{outline:2px solid var(--primary)}
.folders{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 0}
.folder{position:relative;border-radius:16px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;cursor:pointer;transition:transform .15s ease}
.folder:hover{transform:translateY(-2px)}
.cover{aspect-ratio:16/10;background:var(--c);background-size:cover;background-position:center;position:relative}
.cover.blank{background-image:radial-gradient(rgba(255,255,255,.2) 1.2px, transparent 1.3px);background-size:12px 12px}
.cover.blank::after{content:attr(data-initial);position:absolute;right:12px;bottom:2px;font:700 44px/1 var(--hand);color:rgba(255,255,255,.85)}
.folder-body{padding:10px 12px 12px}
.folder-title{font-size:15px;font-weight:700;color:var(--text)}
.folder-meta{font-size:12px;color:var(--muted);margin-top:2px}
.folder-latest{font-size:12.5px;color:var(--muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-top:6px;border-top:1px solid var(--line)}
.pic-btn{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:10px;border:0;background:rgba(0,0,0,.35);color:#fff;display:grid;place-items:center;font-size:14px;z-index:2;cursor:pointer}
.pic-btn:hover{background:rgba(0,0,0,.55)}
.back{border:0;background:none;color:var(--primary-strong);font-size:15px;font-weight:600;padding:6px 0}
.banner{margin:8px 0 0;border-radius:18px;overflow:hidden;position:relative;box-shadow:var(--shadow)}
.banner .cover{aspect-ratio:auto;height:170px}
.banner .cover::before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%, rgba(0,0,0,.4))}
.banner h2{position:absolute;left:16px;bottom:10px;margin:0;color:#fff;font:700 40px/1 var(--hand)}
.folder-tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
.rec{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.rec:last-child{border-bottom:0}
.rec .t{flex:1;min-width:0;font-size:15px}
.rec .d{font-size:12px;color:var(--muted);white-space:nowrap}
.rec.open .t{color:var(--muted)}
.rec.open .t::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:1px}
.rec .t.ok::before{content:"✓";color:var(--primary);font-weight:700;margin-right:8px}
.rec-list{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.rep-group{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:10px 14px;margin-top:10px}
.rep-group h4{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--primary);margin:2px 0 6px}
.rep-group ul{margin:0;padding:0;list-style:none}
.rep-group li{font-size:15px;padding:3px 0}
.rep-group li::before{content:"✓  ";color:var(--primary);font-weight:700}
.rep-group.open li{color:var(--muted)}
.rep-group.open li::before{content:"○  ";color:var(--accent)}
.rep-group .rec{padding:8px 0;background:none}
.bookrow{background:var(--surface);padding:12px 14px;border-bottom:1px solid var(--line)}

/* ---- history ---- */
.grid-wrap{overflow-x:auto;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:12px}
table.hist{border-collapse:separate;border-spacing:3px;font-size:12.5px}
table.hist th{color:var(--text);text-align:left;padding-right:8px;white-space:nowrap;font-weight:500}
table.hist td.c{width:14px;min-width:14px;height:14px;border-radius:4px;background:var(--surface-2);padding:0}
table.hist td.streak{color:var(--muted);padding-left:8px;white-space:nowrap;font-variant-numeric:tabular-nums}
table.hist thead th{font-size:10px;color:var(--muted);text-align:center;padding:0}
.switch{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);border-radius:12px;padding:8px 12px 8px 8px;font-size:14px;font-weight:600;color:var(--muted)}
.switch .knob{width:34px;height:20px;border-radius:10px;background:var(--line);position:relative;transition:background .15s}
.switch .knob::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch[aria-checked="true"]{color:var(--primary-strong)}
.switch[aria-checked="true"] .knob{background:var(--primary)}
.switch[aria-checked="true"] .knob::after{transform:translateX(14px)}
.rec-d{border-bottom:1px solid var(--line)}
.rec-d:last-child{border-bottom:0}
.rec-d>summary{list-style:none;cursor:pointer;border-bottom:0}
.rec-d>summary::-webkit-details-marker{display:none}
.rec-d[open]>summary{background:var(--surface-2)}
.note-prev{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-d[open] .note-prev{display:none}
.pen{color:var(--muted);font-size:14px;flex:none;opacity:.7}
.rec-d[open] .pen{color:var(--primary);opacity:1}
textarea.note{display:block;box-sizing:border-box;width:calc(100% - 28px);margin:0 14px 14px;min-height:110px;resize:vertical;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;font:14.5px/1.5 var(--ui);color:var(--text)}
textarea.note:focus{outline:2px solid var(--primary);outline-offset:0;border-color:transparent}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-h{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding-bottom:2px}
.cal-d{aspect-ratio:1;border-radius:9px;background:var(--surface-2);display:grid;place-items:center}
.cal-d i{font-style:normal;font-size:12.5px;font-weight:600;color:var(--text)}
.cal-d.fut{opacity:.4}
.cal-d.now{box-shadow:inset 0 0 0 2px var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== visual polish ===== */
:root{--glow:#F1D9DC; --hero:#7B1E2C; --hero2:#A8384A; --radius:20px; --shadow:0 1px 2px rgba(91,20,32,.05),0 8px 24px rgba(91,20,32,.07)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--glow:#3A1820; --hero:#5E1A25; --hero2:#7A2433; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25)}}
:root[data-theme="dark"]{--glow:#3A1820; --hero:#5E1A25; --hero2:#7A2433; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25)}
body{background:radial-gradient(900px 420px at 50% -120px, var(--glow), transparent 70%) no-repeat, var(--bg)}
.page{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}

header{background:linear-gradient(150deg, var(--hero) 0%, var(--hero2) 100%);position:relative;overflow:hidden;border-radius:26px;padding:16px 18px 18px;box-shadow:0 12px 30px rgba(123,30,44,.28)}
header::before,header::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
header::before{width:220px;height:220px;right:-70px;top:-90px}
header::after{width:140px;height:140px;left:-50px;bottom:-70px}
header>*{position:relative}
.titles{flex:1;text-align:center}
.datebar h1{font-size:42px}
.hero-date{margin:2px 0 0;font-size:13px;opacity:.85;letter-spacing:.02em}
.hero-row{display:flex;align-items:center;gap:16px;margin-top:14px}
.ring{position:relative;width:84px;height:84px;flex:none}
.ring svg{width:84px;height:84px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring-bg{stroke:rgba(255,255,255,.2)}
.ring-fg{stroke:#fff;stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:19px;font-weight:700}
.meter{flex:1;margin-top:0;min-width:0}
.meter-line b{font-size:24px}
.meta{flex-direction:column;gap:2px;margin-top:8px}

];

/* ---------- state ---------- */
const LS = "dailystuff_v1";
let settings = structuredClone(DEFAULT_SETTINGS);
let days = {};                  // "YYYY-MM-DD" -> {routine, v:{habitId:value}}
let weeks = {};                 // monday "YYYY-MM-DD" -> {items:[{id, h, text, done}]}
let cur = new Date(); cur.setHours(0,0,0,0);
let view = "today", editing = false, weekOffset = 0, dashMode = "all", dashQuery = "", openFolder = null;
let covers = {};   // headingId -> jpeg data URL
try{ covers = JSON.parse(localStorage.getItem(LS+"_covers") || "{}"); }catch(e){}
const FOLDER_COLORS = ["#7B1E2C","#B04A5A","#8E5A8C","#C27C4E","#B8892F","#6E8B6B","#5D7A99","#9A6B7E","#A0522D","#6B4E71","#7E8F5A","#C0687B"];
const HABIT_EMOJI = {hygiene:"🪥",skinam:"🧴",skinpm:"🌙",water:"🫖",read:"📖",gym:"🏋️",study:"📚",journal:"📝",coding:"💻",youtube:"📺",jobs:"💼",kaggle:"📊",audio:"🎧",prayer:"🙏",techj:"🗒️",app:"📱",walk:"🚶‍♀️"};
const HEAD_EMOJI = {books:"📚",learn:"🧠",movie:"🎬",apps:"📱",websites:"🌐",finance:"💰",bts:"💜",art:"🎨",youtube:"📺",visit:"📍",todo:"✅",quote:"💬",sidehustle:"🚀",planner:"🗓️",journal:"📓",write:"✍️",skincare:"🧴",haircare:"💇‍♀️",makeup:"💄",whimsical:"🌈",hobbies:"🧩",games:"🎲",music:"🎵",projects:"🛠️"};
const habitEmoji = h => h.emoji || HABIT_EMOJI[h.id] || "✨";
const headEmoji = id => { const hd = settings.headings.find(h=>h.id===id); return (hd && hd.emoji) || HEAD_EMOJI[id] || "📁"; };
const colorFor = id => { const i = Math.max(0, settings.headings.findIndex(h=>h.id===id)); return id==="books" ? "#6B4E3D" : FOLDER_COLORS[i % FOLDER_COLORS.length]; };
const newId = () => "i"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let db = null, uid = null, downloads = null;
const dirty = new Set(), timers = {};

let hadLocal = false;
try{ const s = JSON.parse(localStorage.getItem(LS) || "null"); if(s){ settings = s.settings || settings; days = s.days || {}; weeks = s.weeks || {}; hadLocal = true; } }catch(e){}

const key = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const mondayOf = d => { const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; };
const curWeekKey = () => key(addDays(mondayOf(new Date()), weekOffset*7));
const weekOf = wk => weeks[wk] || {items:[]};
const isWeekend = d => d.getDay()===0 || d.getDay()===6;
const todayKey = () => key(new Date());
const fmtMin = m => m>=60 ? `${Math.floor(m/60)}h${m%60?` ${m%60}m`:""}` : `${m}m`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function dayOf(k){
  const r = isWeekend(new Date(k+"T00:00")) ? "we" : "wd";   // Sat/Sun = weekend routine, Mon–Fri = weekday
  const d = days[k];
  if(d){ d.routine = r; return d; }
  return {routine: r, v:{}};
}
function habitsFor(r){ return settings.habits.filter(h => h.targets[r] != null); }
function val(k,h){ return Number(dayOf(k).v[h.id] || 0); }
function isDone(k,h){ const t = h.targets[dayOf(k).routine]; return t!=null && val(k,h) >= t; }
function dayRatio(k){
  const hs = habitsFor(dayOf(k).routine); if(!hs.length) return 0;
  return hs.filter(h => isDone(k,h)).length / hs.length;
}

/* ---------- saving ---------- */
let saveTimer = null;
/* ---------- storage: IndexedDB (the browser's built-in database, hundreds of MB) ----------
   Falls back to localStorage only if IndexedDB isn't available. */
const IDB = (()=>{
  let dbp = null;
  const open = ()=> dbp || (dbp = new Promise((res, rej)=>{
    if(!("indexedDB" in window)) return rej(new Error("no indexedDB"));
    const r = indexedDB.open("dailystuff", 1);
    r.onupgradeneeded = ()=> r.result.createObjectStore("kv");
    r.onsuccess = ()=> res(r.result); r.onerror = ()=> rej(r.error);
  }));
  return {
    get: k => open().then(db => new Promise((res, rej)=>{ const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = ()=>res(q.result); q.onerror = ()=>rej(q.error); })),
    set: (k, v) => open().then(db => new Promise((res, rej)=>{ const tx = db.transaction("kv","readwrite"); tx.objectStore("kv").put(v, k); tx.oncomplete = res; tx.onerror = ()=>rej(tx.error); }))
  };
})();
let idbOK = false, persistTimer = null;
function persistLocal(){
  clearTimeout(persistTimer);
  persistTimer = setTimeout(()=>{
    if(idbOK) IDB.set("main", {settings, days, weeks}).catch(()=>setSync("Couldn’t save, storage may be full"));
    else try{ localStorage.setItem(LS, JSON.stringify({settings, days, weeks})); }catch(e){ setSync("Storage is full, download a backup"); }
  }, 250);
}
function persistCovers(){
  if(idbOK) IDB.set("covers", covers).catch(()=>setSync("Couldn’t save that picture"));
  else try{ localStorage.setItem(LS+"_covers", JSON.stringify(covers)); }catch(e){ setSync("Storage is full, picture not saved"); }
}
async function bootStorage(){
  try{
    const main = await IDB.get("main"); idbOK = true;
    if(main){ settings = main.settings || settings; days = main.days || {}; weeks = main.weeks || {}; hadLocal = true; }
    else if(hadLocal) await IDB.set("main", {settings, days, weeks});          // move older data over
    const at = await IDB.get("atts"); if(at) atts = at;
    const cv = await IDB.get("covers");
    if(cv) covers = cv; else if(Object.keys(covers).length) await IDB.set("covers", covers);
    try{ localStorage.removeItem(LS); localStorage.removeItem(LS+"_covers"); }catch(e){}
    if(navigator.storage?.persist) navigator.storage.persist().catch(()=>{});
  }catch(e){ idbOK = false; }
  migrate();
  document.body.classList.remove("booting"); render();
  if(!window.claude?.use) rollover();
  if(window.__onStorageReady) window.__onStorageReady();
}

/* save a file: Claude's download control when inside Claude, a normal download when standalone */
function saveFile(filename, data){
  if(downloads) return downloads.save({filename, data}).catch(()=>{});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([data], {type:"application/octet-stream"}));
  a.download = filename; document.body.appendChild(a); a.click(); a.remove();
}
const canSaveFiles = () => !!downloads || !window.claude?.use;

/* shrink a photo to a 16:9 cover so it stays small */
let atts = {};   // attachment id -> small JPEG data URL (photos of notes, screenshots…)
function persistAtts(){ if(idbOK) IDB.set("atts", atts).catch(()=>setSync("Couldn’t save that photo")); }
/* shrink a photo so it stays small enough to sync (well under Firestore's 1 MB per document) */
function makePhoto(file){
  return new Promise((res, rej)=>{
    const img = new Image();
    img.onload = ()=>{
      let max = 1100, q = .72, url;
      for(let i = 0; i < 5; i++){
        const r = Math.min(1, max/Math.max(img.width, img.height)), c = document.createElement("canvas");
        c.width = Math.round(img.width*r); c.height = Math.round(img.height*r);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        url = c.toDataURL("image/jpeg", q);
        if(url.length < 700000) break;
        max *= .8; q -= .08;
      }
      URL.revokeObjectURL(img.src); res(url);
    };
    img.onerror = rej; img.src = URL.createObjectURL(file);
  });
}
function makeCover(file){
  return new Promise((res, rej)=>{
    const img = new Image();
    img.onload = ()=>{
      const W = 640, H = 360, c = document.createElement("canvas"); c.width = W; c.height = H;
      const r = Math.max(W/img.width, H/img.height), w = img.width*r, h = img.height*r;
      c.getContext("2d").drawImage(img, (W-w)/2, (H-h)/2, w, h);
      URL.revokeObjectURL(img.src); res(c.toDataURL("image/jpeg", .72));
    };
    img.onerror = rej; img.src = URL.createObjectURL(file);
  });
}
function markDirty(docId){

async function flush(){
  if(!db || !uid){ return; }
  const col = db.collection("data/users/"+uid);
  for(const id of [...dirty]){
    dirty.delete(id);
    try{
      if(id==="settings") await col.doc("settings").set({json: JSON.stringify(settings)});
      else if(id.startsWith("c-")) await col.doc(id).set({img: covers[id.slice(2)] || ""});
      else if(id.startsWith("a-")) await col.doc(id).set({img: atts[id.slice(2)] || ""});
      else if(id.startsWith("w-")) await col.doc(id).set({json: JSON.stringify(weeks[id.slice(2)] || {items:[]})});
      else await col.doc("d-"+id).set({json: JSON.stringify(days[id] || {})});

    }catch(e){ setSync("Couldn’t sync, kept on this device"); }

}

/* move the old single try list into this week's plan, once */
function migrate(){
  let changed = false;
  if(!settings.headings){ settings.headings = structuredClone(DEFAULT_SETTINGS.headings); changed = true; }
  if(!settings.seeded){
    const wk = key(mondayOf(new Date()));
    if(!weeks[wk] || !weeks[wk].items.length){
      const old = settings.tryList || [];
      const doneIdx = new Set(old.filter(t=>t.done && /^t\d{1,2}$/.test(t.id)).map(t=>Number(t.id.slice(1))));
      const items = SEED_WEEK.map(([h,text,i],n)=>({id:"i"+n+"_"+Date.now().toString(36), h, text, done: doneIdx.has(i)}));
      old.filter(t=>!/^t\d{1,2}$/.test(t.id)).forEach(t=>items.push({id:t.id, h:"todo", text:t.text, done:t.done}));
      weeks[wk] = {items}; saveWeek(wk);
    }
    settings.seeded = true; delete settings.tryList; changed = true;
  }
  for(const [wk,w] of Object.entries(weeks)){
    let fix = false;
    for(const it of w.items||[]){ if(!it.oid){ it.oid = it.id; fix = true; } }
    if(fix) saveWeek(wk);
  }
  if(!settings.ratingDefaults1){
    const rateable = new Set(["movie","watch","youtube","apps","websites","visit","games","music","recipes","listen"]);
    (settings.headings||[]).forEach(h=>{ if(!rateable.has(h.id)) h.noRating = true; });
    settings.ratingDefaults1 = true; changed = true;
  }
  if(!settings.groups){
    const plan = [["hygiene","🧼","Hygiene",["hygiene","skinam","skinpm"]],["health","💪","Health",["water","gym","walk"]],
      ["learning","📚","Learning",["read","study","journal","coding","youtube","audio","techj"]],["career","💼","Career",["jobs","kaggle","app"]],["spirit","🙏","Spiritual",["prayer"]]];
    settings.groups = [];
    for(const [id,emoji,name,ids] of plan){
      const mine = settings.habits.filter(x=>ids.includes(x.id) && !x.group);
      if(!mine.length) continue;
      settings.groups.push({id, emoji, name}); mine.forEach(x=>x.group = id);
    }
    changed = true;
  }
  if(changed) saveSettings();
}
migrate();

/* unfinished items roll into the new week automatically */
function moveOpen(fromK, toK){
  const from = weeks[fromK]; if(!from) return 0;
  const to = weeks[toK] = weekOf(toK);
  let n = 0;
  for(const it of from.items){
    if(it.done || it.moved) continue;
    it.moved = true; n++;
    if(!to.items.some(x=>x.oid===it.oid)) to.items.push({id:newId(), oid:it.oid||it.id, h:it.h, text:it.text, done:false, carried:true, rating:it.rating||0, note:it.note||"", atts:[...(it.atts||[])], links:[...(it.links||[])]});
  }
  if(n){ saveWeek(fromK); saveWeek(toK); }
  return n;
}
let rolled = false;
function rollover(){
  if(rolled) return; rolled = true;
  const cw = key(mondayOf(new Date()));
  const prior = Object.keys(weeks).filter(k=>k<cw && (weeks[k].items||[]).some(i=>!i.done && !i.moved)).sort();
  for(const pk of prior) moveOpen(pk, cw);
}

function streakText(){

  let n = 0, d = new Date(); d.setHours(0,0,0,0);

  while(dayRatio(key(d)) >= .8){ n++; d = addDays(d,-1); }

/* every item across all weeks, newest copy wins (carried items share an oid) */

  const recs = new Map();
  for(const wk of Object.keys(weeks).sort()){
    for(const it of weeks[wk].items||[]){
      const prev = recs.get(it.oid||it.id);
      if(prev && prev.done && !it.done) continue;
      recs.set(it.oid||it.id, {...it, wk});
    }
  }
  return [...recs.values()];
}

}

const FB_ERR = {"auth/invalid-credential":"Wrong email or password. New here? Tap Create account.","auth/wrong-password":"Wrong email or password.","auth/user-not-found":"No account with that email yet – tap Create account.","auth/email-already-in-use":"That email already has an account – tap Sign in.","auth/weak-password":"Password needs at least 6 characters.","auth/invalid-email":"That email doesn’t look right.","auth/network-request-failed":"No internet – connect once to sign in.","auth/too-many-requests":"Too many tries, wait a minute and try again.","auth/operation-not-allowed":"That sign-in method is off in Firebase – turn it on under Security → Authentication → Sign-in method.","auth/unauthorized-domain":"Add your GitHub Pages address in Firebase: Authentication → Settings → Authorized domains.","auth/popup-closed-by-user":"","auth/account-exists-with-different-credential":"This email already signed in another way – use that method."};
async function fbReset(){
  const e = document.getElementById("fbEmail")?.value.trim();
  if(!e){ window.fbState = {status:"signedout", msg:"Type your email above first, then tap Forgot password."}; render(); return; }
  try{ await window.fb.reset(e); window.fbState = {status:"signedout", email:e, ok:true, msg:`Reset link sent to ${e}. Check your inbox (and spam), set a new password, then sign in here.`}; }
  catch(err){ window.fbState = {status:"signedout", email:e, msg: FB_ERR[err.code] || err.message}; }
  render();
}
async function fbGoogle(){
  if(!window.fb) return;
  try{ await window.fb.google(); }
  catch(err){ const m = FB_ERR[err.code]; if(m==="") return; window.fbState = {status:"signedout", msg: m || err.message}; render(); }
}
async function fbAuth(kind){
  const e = document.getElementById("fbEmail")?.value.trim(), p = document.getElementById("fbPass")?.value;
  if(!window.fb) return;
  try{ kind==="up" ? await window.fb.signUp(e,p) : await window.fb.signIn(e,p); }
  catch(err){ window.fbState = {status:"signedout", email:e, msg: FB_ERR[err.code] || err.message}; render(); document.getElementById("fbPass")?.focus(); }
}

  return it && {obj:it, save:()=>saveWeek(a)};
}
function attInUse(id){

function reportData(){
  const wkDays = weekDays(), wk = key(wkDays[0]);
  const habits = settings.habits.filter(x=>x.targets.wd!=null || x.targets.we!=null).map(x=>{
    if(x.unit==="check"){
      const planned = wkDays.filter(d=>x.targets[dayOf(key(d)).routine]!=null).length;
      const done = wkDays.filter(d=>val(key(d),x)>=1).length;
      return {x, done, goal:planned, text:`${done} / ${planned} days`};
    }
    const goal = wkDays.reduce((a,d)=>a+(x.targets[dayOf(key(d)).routine]||0),0);
    const sum = wkDays.reduce((a,d)=>a+val(key(d),x),0);
    return {x, done:sum, goal, text: x.unit==="min" ? `${fmtMin(sum)} / ${fmtMin(goal)}` : `${sum} / ${goal} ${UNIT[x.unit]}`};
  });
  const items = weekOf(wk).items;
  const focus = wkDays.reduce((a,d)=>a+settings.habits.filter(x=>x.unit==="min").reduce((b,x)=>b+val(key(d),x),0),0);
  const met = habits.filter(r=>r.goal && r.done>=r.goal).length;
  const tracked = wkDays.filter(d=>d<=new Date());
  const avg = tracked.length ? Math.round(tracked.reduce((a,d)=>a+dayRatio(key(d)),0)/tracked.length*100) : 0;
  return {wk, habits, items, focus, met, avg};
}

function renderReport(){
  const r = reportData();

    const its = list.filter(i=>i.h===hd.id); if(!its.length) return "";
    return `<div class="rep-group ${cls}"><h4>${esc(hd.name)}</h4><ul>${its.map(i=>`<li>${esc(i.text)}</li>`).join("")}</ul></div>`;
  }).join("");
  let h = `<section>${dashToggle()}${weekNav("Report:")}
    <div class="summary">
      <div><b>${done.length}/${r.items.length}</b><span>weekly topics done</span></div>
      <div><b>${r.avg}%</b><span>of daily stuff, on average</span></div>
      <div><b>${fmtMin(r.focus)}</b><span>focused time logged</span></div>

    </div>
    <h2>Completed this week</h2>${done.length ? group(done,"") : `<p class="sub">Nothing checked off yet. Tick things in “This week” as you go.</p>`}

  for(const row of r.habits){
    const pct = row.goal ? Math.min(100,row.done/row.goal*100) : 0;

      <div class="bar"><i style="width:${pct}%"></i></div></div>`;
  }
  h += `</div><h2>Books</h2><div class="card">`;
  for(const b of settings.books) h += `<div class="wk"><div class="wk-top"><span class="wk-name">${esc(b.name)}</span><span class="wk-num"><b>page ${b.current}</b> / ${b.goal}</span></div></div>`;

  return h;
}

function reportText(){
  const r = reportData(), wk = weekDays();
  const L = [`# Weekly report: ${wk[0].toDateString()} – ${wk[6].toDateString()}`, "",
    `- Weekly topics done: ${r.items.filter(i=>i.done).length}/${r.items.length}`,

  settings.headings.forEach(hd=>{ const its = r.items.filter(i=>i.h===hd.id && i.done); if(its.length){ L.push(`**${hd.name}**`); its.forEach(i=>L.push(`- [x] ${i.text}`)); }});
  L.push("", "## Daily stuff"); r.habits.forEach(x=>L.push(`- ${x.x.name}: ${x.text}`));
  L.push("", "## Books"); settings.books.forEach(b=>L.push(`- ${b.name}: page ${b.current}/${b.goal}`));
  const open = r.items.filter(i=>!i.done);

  return L.join("\n");
}

let monthOffset = 0;

const expanded = new Set();   // which dashboard entries have their notes open
const shade = r => r ? `background:color-mix(in srgb, var(--ink) ${Math.round(25+r*75)}%, var(--ink-wash))` : "";
let histMode = "month", yearOffset = 0;
function histToggle(){
  return `<div class="seg" role="group" aria-label="History view" style="margin-bottom:6px"><button data-act="histmode" data-m="month" aria-pressed="${histMode==="month"}">Month</button><button data-act="histmode" data-m="year" aria-pressed="${histMode==="year"}">Year</button></div>`;
}
function renderHistory(){ return histMode==="year" ? renderYear() : renderMonth(); }

function renderYear(){
  const t = new Date(); t.setHours(0,0,0,0);
  const Y = t.getFullYear() + yearOffset, isCur = yearOffset===0;
  const allDays = []; for(let d = new Date(Y,0,1); d.getFullYear()===Y; d = addDays(d,1)) allDays.push(new Date(d));
  const past = allDays.filter(d=>d<=t);
  const tracked = past.filter(d=>days[key(d)] && Object.keys(days[key(d)].v||{}).length);
  const ratios = past.map(d=>dayRatio(key(d)));
  const avg = tracked.length ? Math.round(tracked.reduce((a,d)=>a+dayRatio(key(d)),0)/tracked.length*100) : 0;
  const strong = ratios.filter(r=>r>=.8).length;
  let best = 0, run = 0; for(const r of ratios){ run = r>=.8 ? run+1 : 0; best = Math.max(best, run); }
  const minHabits = settings.habits.filter(x=>x.unit==="min");
  const focus = past.reduce((a,d)=>a+minHabits.reduce((b,x)=>b+val(key(d),x),0),0);
  const recs = records().filter(r=>r.done && String(r.doneAt||r.wk).startsWith(String(Y)));
  let h = `<section>${histToggle()}<div class="datebar"><button class="iconbtn" data-act="yprev" aria-label="Previous year">‹</button>
    <h2 style="margin:8px 0;flex:1;text-align:center">${Y} in review</h2>
    <button class="iconbtn" data-act="ynext" aria-label="Next year" ${isCur?"disabled style=\"opacity:.3\"":""}>›</button></div>
    <div class="summary">
      <div><b>${avg}%</b><span>average day</span></div>
      <div><b>${strong}</b><span>strong days (80%+)</span></div>
      <div><b>🔥 ${best}</b><span>best streak (days)</span></div>
      <div><b>${Math.round(focus/60)}h</b><span>focused time</span></div>
      <div><b>${tracked.length}</b><span>days tracked</span></div>
      <div><b>${recs.length}</b><span>things finished</span></div>
    </div>`;
  // 12 mini calendars
  h += `<h2>Every day of ${Y}</h2><p class="sub">Darker means more of your daily stuff got done.</p><div class="card" style="padding:12px"><div class="yeargrid">`;
  for(let m = 0; m < 12; m++){
    const first = new Date(Y,m,1), n = new Date(Y,m+1,0).getDate(), lead = (first.getDay()+6)%7;
    h += `<button class="mini-month" data-act="gomonth" data-y="${Y}" data-m="${m}" aria-label="Open ${first.toLocaleDateString(undefined,{month:"long"})}"><span class="mm-name">${first.toLocaleDateString(undefined,{month:"short"})}</span><span class="mm-grid">${"<i class=\"pad\"></i>".repeat(lead)}${[...Array(n)].map((_,i)=>{
      const d = new Date(Y,m,i+1), r = d>t ? 0 : dayRatio(key(d));
      return `<i class="${d>t?"fut":""}" style="${shade(r)}"></i>`; }).join("")}</span></button>`;
  }
  h += `</div></div>`;
  // month-by-month bars
  h += `<h2>Month by month</h2><div class="card" style="padding:14px 12px 10px"><div class="mbars">`;
  for(let m = 0; m < 12; m++){
    const md = past.filter(d=>d.getMonth()===m), a = md.length ? md.reduce((x,d)=>x+dayRatio(key(d)),0)/md.length : 0;
    h += `<div class="mbar"><span class="mbar-v">${md.length?Math.round(a*100):""}</span><div class="mbar-track"><i style="height:${Math.round(a*100)}%"></i></div><span class="mbar-l">${new Date(Y,m,1).toLocaleDateString(undefined,{month:"narrow"})}</span></div>`;
  }
  h += `</div></div>`;
  // totals per habit
  h += `<h2>Habit totals</h2><div class="card">`;
  const rows = settings.habits.map(x=>{
    let total = 0, daysHit = 0;
    for(const d of past){ const k = key(d), v = val(k,x), tg = x.targets[dayOf(k).routine]; total += v; if(tg!=null && v>=tg) daysHit++; }
    const label = x.unit==="min" ? `${(total/60).toFixed(total>=600?0:1)} h` : x.unit==="check" ? `${daysHit} days` : `${total} ${UNIT[x.unit]}`;
    return {x, daysHit, label};
  }).sort((a,b)=>b.daysHit-a.daysHit);
  const maxHit = Math.max(1, ...rows.map(r=>r.daysHit));
  for(const r of rows) h += `<div class="wk"><div class="wk-top"><span class="wk-name">${habitEmoji(r.x)} ${esc(r.x.name)}</span><span class="wk-num"><b>${r.label}</b>${r.x.unit!=="check"?` · ${r.daysHit} goal days`:""}</span></div><div class="bar"><i style="width:${r.daysHit/maxHit*100}%"></i></div></div>`;
  h += `</div>`;
  // favorites of the year
  const favs = recs.filter(r=>r.rating && ratingOn(r.h)).sort((a,b)=>b.rating-a.rating).slice(0,12);
  const books = settings.books.filter(b=>b.rating && ratingOn("books")).sort((a,b)=>b.rating-a.rating);
  if(favs.length || books.length){
    h += `<h2>Favorites</h2><div class="rec-list">`;
    for(const b of books) h += `<div class="rec"><span class="t">📚 ${esc(b.name)}</span><span class="stars">${"★".repeat(b.rating).split("").map(()=>'<button class="on" tabindex="-1">★</button>').join("")}</span></div>`;
    for(const r of favs) h += `<div class="rec"><span class="t">${headEmoji(r.h)} ${esc(r.text)}</span><span class="stars">${[...Array(r.rating)].map(()=>'<button class="on" tabindex="-1">★</button>').join("")}</span></div>`;
    h += `</div>`;
  }
  // finished per category
  const byHead = settings.headings.map(hd=>({hd, n: recs.filter(r=>r.h===hd.id).length})).filter(x=>x.n).sort((a,b)=>b.n-a.n);
  if(byHead.length){
    h += `<h2>What you finished</h2><div class="card" style="padding:12px 14px"><div class="chips">${byHead.map(x=>`<span class="chip" style="cursor:default">${headEmoji(x.hd.id)} ${esc(x.hd.name)} <b style="margin-left:4px">${x.n}</b></span>`).join("")}</div></div>`;
  }
  if(!tracked.length && !recs.length) h += `<p class="empty">Nothing tracked in ${Y} yet.</p>`;
  return h + `</section>`;
}

function renderMonth(){
  const t = new Date(); t.setHours(0,0,0,0);
  const first = new Date(t.getFullYear(), t.getMonth()+monthOffset, 1);
  const n = new Date(first.getFullYear(), first.getMonth()+1, 0).getDate();
  const ds = [...Array(n)].map((_,i)=>new Date(first.getFullYear(), first.getMonth(), i+1));
  const past = ds.filter(d=>d<=t);
  const isCur = monthOffset===0;
  const avg = past.length ? Math.round(past.reduce((a,d)=>a+dayRatio(key(d)),0)/past.length*100) : 0;
  const good = past.filter(d=>dayRatio(key(d))>=.8).length;
  const title = first.toLocaleDateString(undefined,{month:"long", year:"numeric"});
  let h = `<section>${histToggle()}<div class="datebar"><button class="iconbtn" data-act="mprev" aria-label="Previous month">‹</button>
    <h2 style="margin:8px 0;flex:1;text-align:center">${title}</h2>
    <button class="iconbtn" data-act="mnext" aria-label="Next month" ${isCur?"disabled style=\"opacity:.3\"":""}>›</button></div>
    <div class="summary"><div><b>${avg}%</b><span>of daily stuff, on average</span></div><div><b>${good}</b><span>strong days (80%+)</span></div></div>`;
  // month calendar: overall completion per day
  const lead = (first.getDay()+6)%7;
  h += `<div class="card" style="padding:12px"><div class="cal">${["M","T","W","T","F","S","S"].map(x=>`<span class="cal-h">${x}</span>`).join("")}
    ${"<span></span>".repeat(lead)}${ds.map(d=>{
      const k = key(d), fut = d>t, r = fut ? 0 : dayRatio(k);
      return `<span class="cal-d ${fut?"fut":""} ${k===todayKey()?"now":""}" style="${shade(r)}" title="${k}: ${Math.round(r*100)}%"><i style="${r>.55?"color:var(--on-primary)":""}">${d.getDate()}</i></span>`;
    }).join("")}</div></div>`;
  h += `<h2>By habit</h2><p class="sub">Darker means closer to the goal that day. ${isCur?"Last column is your current streak.":"Last column is days you hit the goal."}</p>
    <div class="grid-wrap"><table class="hist"><thead><tr><th></th>${ds.map(d=>`<th>${d.getDate()%5===1?d.getDate():""}</th>`).join("")}<th></th></tr></thead><tbody>`;
  for(const x of settings.habits){
    let last = 0;
    if(isCur){
      for(let i = 0; i < 365; i++){
        const d = addDays(t,-i), k = key(d), tg = x.targets[dayOf(k).routine];
        if(tg==null) continue;
        if(val(k,x) >= tg) last++;
        else if(i===0) continue;
        else break;
      }
    } else last = ds.filter(d=>{ const k = key(d), tg = x.targets[dayOf(k).routine]; return tg!=null && val(k,x)>=tg; }).length;
    h += `<tr><th>${esc(x.name)}</th>${ds.map(d=>{
      const k = key(d), tg = x.targets[dayOf(k).routine];
      if(d>t) return `<td class="c" style="opacity:.25"></td>`;
      if(tg==null) return `<td class="c" style="opacity:.35" title="${k}: not planned"></td>`;
      const r = Math.min(1, val(k,x)/tg);
      return `<td class="c" title="${k}: ${val(k,x)}/${tg}" style="${shade(r)}"></td>`;
    }).join("")}<td class="streak">${last}</td></tr>`;
  }
  return h + `</tbody></table></div></section>`;
}

  else if(a==="fbreset"){ fbReset(); }
  else if(a==="fbsignup"){ fbAuth("up"); }

  else if(a==="ratingtoggle"){ setRating(el.dataset.f, !ratingOn(el.dataset.f)); render(); }
  else if(a==="rmcover"){ delete covers[el.dataset.f]; persistCovers(); markDirty("c-"+el.dataset.f); render(); }

  const row = t.closest(".edit"); if(!row || !row.dataset.id) return;

  else if(f==="unit"){ const was = x.unit; x.unit = t.value;
    if(t.value==="check"){ for(const r of ["wd","we"]) if(x.targets[r]!=null) x.targets[r] = 1; }
    else if(was==="check"){ for(const r of ["wd","we"]) if(x.targets[r]!=null) x.targets[r] = 15; x.step = 5; } }
  else if(f==="wdc"||f==="wec"){ const r = f.slice(0,2); if(t.checked) x.targets[r] = 1; else delete x.targets[r]; }
  else if(f==="wd"||f==="we"){ if(t.value==="") delete x.targets[f]; else x.targets[f] = Number(t.value); }
  else if(f==="emoji") x.emoji = t.value.trim();
  else if(f==="group"){ if(t.value) x.group = t.value; else delete x.group; }
  else if(f==="step") x.step = Math.max(1, Number(t.value)||5);
  saveSettings(); render();
});

/* ---------- sync engine: works with Firebase (offline app) or Claude storage ---------- */
let syncKind = null, unsubSync = null, syncState = "local";
function syncLabel(snap){
  if(!navigator.onLine) return "📴 Offline – saved on this device, will sync when you’re back online";
  if(snap && snap.pending) return "⏳ Syncing…";
  if(snap && snap.fromCache) return "📴 Offline – saved on this device, will sync when you’re back online";
  return syncKind==="firebase" ? "✅ Synced to your devices" : "✅ Synced to your account";
}
window.startSync = function(adapter, id, kind){
  if(unsubSync) try{ unsubSync(); }catch(e){}
  db = adapter; uid = id; syncKind = kind;
  let merged = false, first = true;
  const giveUp = setTimeout(()=>{ if(first) setSync("Couldn’t reach sync yet – saving on this device"); }, 12000);
  unsubSync = db.collection("data/users/"+uid).onSnapshot(snap=>{
    clearTimeout(giveUp);
    let coversChanged = false, attsChanged = false;
    for(const doc of snap.docs){
      if(doc.id.startsWith("a-")){ const aid = doc.id.slice(2), img = doc.data()?.img;
        if(!dirty.has(doc.id)){ if(img) atts[aid] = img; else delete atts[aid]; attsChanged = true; } continue; }
      if(doc.id.startsWith("c-")){ const cid = doc.id.slice(2), img = doc.data()?.img;
        if(!dirty.has(doc.id)){ if(img) covers[cid] = img; else delete covers[cid]; coversChanged = true; } continue; }
      let data; try{ data = JSON.parse(doc.data()?.json || "null"); }catch(e){ continue; }
      if(!data) continue;
      if(doc.id==="settings"){ if(!dirty.has("settings")) settings = data; }
      else if(doc.id.startsWith("d-")){ const k = doc.id.slice(2); if(!dirty.has(k)) days[k] = data; }
      else if(doc.id.startsWith("w-")){ if(!dirty.has(doc.id)) weeks[doc.id.slice(2)] = data; }
    }
    // first answer from the server: upload anything this device has that the cloud doesn't
    if(!merged && !snap.fromCache){
      merged = true;
      const remote = new Set(snap.docs.map(d=>d.id));
      if(hadLocal || snap.empty){
        if(!remote.has("settings")) markDirty("settings");
        Object.keys(days).forEach(k=>{ if(!remote.has("d-"+k)) markDirty(k); });
        Object.keys(weeks).forEach(k=>{ if(!remote.has("w-"+k)) markDirty("w-"+k); });
        Object.keys(covers).forEach(k=>{ if(!remote.has("c-"+k)) markDirty("c-"+k); });
        Object.keys(atts).forEach(k=>{ if(!remote.has("a-"+k)) markDirty("a-"+k); });
      }
    }
    migrate(); rollover(); if(coversChanged) persistCovers(); if(attsChanged) persistAtts();
    first = false; persistLocal(); setSync(syncLabel(snap));
    if(!isTyping()) render();
    else renderHeader();
  }, ()=>{ clearTimeout(giveUp); setSync("Couldn’t sync – saving on this device"); });
  if(dirty.size) flush();
};
window.stopSync = function(){
  if(unsubSync) try{ unsubSync(); }catch(e){}
  unsubSync = null; db = null; uid = null; syncKind = null;
  setSync("Saved on this device");
};

  claude.use("downloads").then(d=>{ downloads = d; if(d && view==="dash") render(); }).catch(()=>{});
  try{
    const [d, u] = await Promise.all([claude.use("db"), claude.use("user")]);
    if(!d || !u) return;
    const id = await u.id(); if(!id) return;
    window.startSync(d, id, "claude");
  }catch(e){}
})();
</script>
<script type="module">
/* Firebase sync: offline-first. Firestore keeps its own copy on the device and
   uploads changes automatically whenever you're online. */
const V = "10.12.2";
const announce = st => { window.fbState = st; dispatchEvent(new Event("fb-change")); };
let cfg = null;
try{ cfg = (await import("./firebase-config.js")).firebaseConfig; }catch(e){}
if(!cfg || !cfg.apiKey || String(cfg.apiKey).startsWith("PASTE")) announce({status:"unconfigured"});
else{
  announce({status:"loading"});
  try{
    const [{initializeApp}, A, F] = await Promise.all([
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`)
    ]);
    const app = initializeApp(cfg);
    const auth = A.initializeAuth(app, {persistence: [A.indexedDBLocalPersistence, A.browserLocalPersistence], popupRedirectResolver: A.browserPopupRedirectResolver});
    const fs = F.initializeFirestore(app, {localCache: F.persistentLocalCache({tabManager: F.persistentMultipleTabManager()})});
    window.fb = {
      signIn: (e,p)=>A.signInWithEmailAndPassword(auth,e,p),
      signUp: (e,p)=>A.createUserWithEmailAndPassword(auth,e,p),
      signOut: ()=>A.signOut(auth),
      reset: e=>A.sendPasswordResetEmail(auth, e),
      google: async ()=>{
        const provider = new A.GoogleAuthProvider();
        try{ await A.signInWithPopup(auth, provider); }
        catch(e){
          if(["auth/popup-blocked","auth/operation-not-supported-in-this-environment","auth/cancelled-popup-request"].includes(e.code)) await A.signInWithRedirect(auth, provider);
          else throw e;
        }
      }
    };
    const ready = new Promise(res=>{ if(!document.body.classList.contains("booting")) res(); else window.__onStorageReady = res; });
    A.onAuthStateChanged(auth, async user=>{
      await ready;
      if(user){
        const col = F.collection(fs, "users", user.uid, "docs");
        const adapter = { collection: ()=>({
          doc: id => ({ set: data => { F.setDoc(F.doc(col, id), data).catch(err=>console.warn("sync", err)); return Promise.resolve(); } }),
          onSnapshot: (cb, onErr) => F.onSnapshot(col, {includeMetadataChanges:true},
            s => cb({docs: s.docs.map(d=>({id:d.id, data:()=>d.data()})), empty: s.empty, fromCache: s.metadata.fromCache, pending: s.metadata.hasPendingWrites}), onErr)
        })};
        announce({status:"signedin", email:user.email});
        window.startSync(adapter, user.uid, "firebase");
      } else {
        window.stopSync && window.stopSync();
        announce({status:"signedout"});
      }
    });
  }catch(e){
    announce({status: navigator.onLine ? "error" : "loading", msg: navigator.onLine ? String(e.message||e) : ""});
  }
}
</script>

if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
